[project]
name = "wellfound-agent"
version = "0.1.0"
description = "An automated, privacy-first job application agent that uses local decision and generation models to discover, evaluate, and apply to startup roles on Wellfound."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Vipin Kumar", email = "krvipin15@tutamail.com" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pytest",
    "Typing :: Typed",
]
dependencies = [
    "email-validator>=2.3.0",
    "playwright>=1.63.0",
    "playwright-stealth>=2.0.3",
    "pydantic-settings>=2.15.0",
    "sentry-sdk>=2.71.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.16.10", "ty>=0.0.84"]

[project.scripts]
wellfound-agent = "wellfound_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project.urls]
"Source" = "https://github.com/krvipin15/wellfound-agent"
"Documentation" = "https://krvipin15.github.io/wellfound-agent/"
"Bug Reports" = "https://github.com/krvipin15/wellfound-agent/issues"

[tool.ty.environment]
python = ".venv"
python-platform = "linux"
python-version = "3.12"
root = ["."]

[tool.ty.terminal]
output-format = "concise"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # Blind except
    "C4",   # flake8-comprehensions
    "D",    # docstrings
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "ERA",  # eradicate (commented-out code)
    "F",    # pyflakes
    "FBT",  # Boolean traps
    "G",    # Logging format
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (basic security)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",    # line too long
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "S311",    # pseudo-random generator
    "N803",    # argument name lowercase
    "N806",    # variable name lowercase
    "N815",    # variable in class scope mixedCase
]

[tool.ruff.lint.per-file-ignores]
"src/wellfound_agent/config/settings.py" = ["N802", "S104"]
"src/wellfound_agent/config/logger.py" = ["FBT003"]
"tests/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-statements = 60

[tool.pytest.ini_options]
env = ["ENVIRONMENT=testing"]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=wellfound_agent",
    "--cov-fail-under=85",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "-ra",
]
markers = [
    "integration: tests requiring external services",
    "unit: fast, isolated unit tests",
    "e2e: end-to-end pipeline tests",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/__init__.py",
    "*/conftest.py",
    "tests/*",
    "src/wellfound_agent/config/logger.py",
    "src/wellfound_agent/config/settings.py",
]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
fail_under = 85
show_missing = true
skip_covered = false
