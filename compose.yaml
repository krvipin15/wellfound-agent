services:
  temporal:
    image: docker.io/temporalio/temporal:latest
    container_name: wellfound-temporal
    restart: unless-stopped

    ports:
      - "7233:7233"
      - "8233:8233"

    command:
      - server
      - start-dev
      - --ip
      - "0.0.0.0"

  worker:
    build: .
    volumes:
      - .:/app
    environment:
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      - temporal
    command: python3 -m wellfound_agent.workflows.worker
